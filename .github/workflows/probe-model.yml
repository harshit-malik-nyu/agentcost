name: probe-model
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Probe external model availability
        run: bash scripts/probe_model.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-availability-probe
          path: MODEL_PROBE.txt
