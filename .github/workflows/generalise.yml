name: generalise
on:
  push:
    branches: [main]
    paths: ['.generalise-trigger']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generalise
jobs:
  squad:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache
          key: squad-models-v1
      - name: Install
        timeout-minutes: 15
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers
          pip install --quiet -e .
      - name: Measure on SQuAD v2, three architectures
        run: |
          mkdir -p evidence
          python scripts/measure_real_agent.py \
            --task squad --all-models --contracts 300 --max-chars 3000 \
            --budget 1500 --out evidence/squad_agent.json \
            2>&1 | tee evidence/generalise-run.txt
      - name: Mechanism and fix on the second task
        if: always()
        run: |
          python scripts/analyse_mechanism.py --glob 'squad_agent.*.json' \
            --out evidence/mechanism_squad.json 2>&1 | tee -a evidence/generalise-run.txt || true
      - name: Summary
        if: always()
        run: |
          { echo '## Generalisation: SQuAD v2'; echo; echo '```';
            tail -40 evidence/generalise-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence
          git diff --staged --quiet || {
            git commit -m "evidence: generalisation run [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          }
