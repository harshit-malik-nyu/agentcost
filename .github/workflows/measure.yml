name: measure-real-agent
on:
  push:
    branches: [main]
    paths: ['scripts/measure_real_agent.py', '.measure-trigger']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: measure
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Cache the model and corpus
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache
          key: cuad-model-v1

      - name: Install
        timeout-minutes: 15
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers
          pip install --quiet -e .

      - name: Measure
        run: |
          # tee cannot create a directory, and git does not track empty ones,
          # so evidence/ is absent from a fresh checkout. Three runs died on
          # this line before the timeout was ever reached.
          mkdir -p evidence
          # Scope set by measured throughput, not optimism. A 6,400-token
          # contract at stride 128 is ~25 windows per question and 41 questions
          # per contract, so roughly a thousand CPU forward passes each. The
          # first attempt asked for 30 contracts and died at the timeout having
          # committed nothing.
          python scripts/measure_real_agent.py \
            --contracts 12 --max-chars 4000 --budget 1200 \
            2>&1 | tee evidence/measure-run.txt

      - name: Job summary
        if: always()
        run: |
          { echo '## Real-agent calibration'; echo; echo '```';
            tail -25 evidence/measure-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence
          git diff --staged --quiet || {
            git commit -m "evidence: real-agent calibration run [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          }
